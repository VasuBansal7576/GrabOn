name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Clone pinned httpx target
        run: git clone --depth 1 --branch 0.28.1 https://github.com/encode/httpx target/httpx

      - name: Gate retrieval regression
        run: |
          python -m src retrieval-eval --path target/httpx --output reports/ci_retrieval_recall.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/ci_retrieval_recall.json").read_text())
          assert report["avg_tree_recall"] > report["avg_grep_recall"]
          assert report["tree_wins"] >= 10
          PY

      - name: Gate fixture benchmark smoke
        run: |
          python -m src eval --combo b --path target/httpx --limit 2 --output reports/ci_combo_b_smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/ci_combo_b_smoke.json").read_text())
          assert report["pass_rate"] == "2/2"
          PY
